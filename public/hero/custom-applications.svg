<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eefcf7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#003366"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0b3d20" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1240" cy="250" r="260" fill="#22c55e" opacity="0.08"/>
  <circle cx="1200" cy="310" r="170" fill="#003366" opacity="0.06"/>
  <circle cx="260" cy="820" r="220" fill="#22c55e" opacity="0.06"/>

  <g filter="url(#softShadow)">
    <rect x="140" y="150" width="1320" height="700" rx="44" fill="#ffffff" stroke="#e5e7eb"/>
  </g>

  <g transform="translate(230 240)">
    <rect x="0" y="0" width="420" height="420" rx="34" fill="url(#accent)"/>
    <rect x="96" y="110" width="228" height="248" rx="26" fill="#ffffff" opacity="0.92"/>
    <rect x="132" y="150" width="156" height="22" rx="10" fill="#003366" opacity="0.8"/>
    <rect x="132" y="190" width="192" height="18" rx="9" fill="#0f172a" opacity="0.25"/>
    <rect x="132" y="222" width="176" height="18" rx="9" fill="#0f172a" opacity="0.22"/>
    <rect x="132" y="254" width="120" height="18" rx="9" fill="#0f172a" opacity="0.2"/>
    <circle cx="210" cy="326" r="22" fill="#22c55e"/>
    <rect x="340" y="130" width="50" height="210" rx="18" fill="#ffffff" opacity="0.35"/>
    <circle cx="365" cy="366" r="26" fill="#ffffff" opacity="0.6"/>
  </g>

  <g transform="translate(720 270)" fill="#0f172a">
    <text x="0" y="0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="56" font-weight="800">
      Custom Applications
    </text>
    <text x="0" y="78" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="28" font-weight="600" fill="#334155">
      Web • SaaS • Mobile • Integrations
    </text>
    <text x="0" y="138" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="22" fill="#475569">
      Build secure platforms with clean APIs, modern UX,
    </text>
    <text x="0" y="172" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="22" fill="#475569">
      and cloud-native performance that scales with your business.
    </text>
  </g>

  <g transform="translate(720 520)">
    <rect x="0" y="0" width="310" height="64" rx="999" fill="#003366"/>
    <text x="30" y="42" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="20" font-weight="700" fill="#ffffff">
      Explore Development
    </text>
    <rect x="340" y="0" width="250" height="64" rx="999" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="370" y="42" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="20" font-weight="700" fill="#0f172a">
      Get Estimate
    </text>
  </g>
</svg>

