  </g>

  <g transform="translate(230 240)">
    <rect x="0" y="0" width="420" height="420" rx="34" fill="url(#accent)"/>
    <path d="M110 248c0-86 64-156 148-156s148 70 148 156" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
    <path d="M170 248c0-52 38-94 88-94s88 42 88 94" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" opacity="0.9"/>
    <circle cx="258" cy="262" r="24" fill="#ffffff"/>
    <path d="M258 300v46" stroke="#ffffff" stroke-width="18" stroke-linecap="round" opacity="0.9"/>
  </g>

  <g transform="translate(720 270)" fill="#0f172a">
