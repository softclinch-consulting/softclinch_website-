<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#003366"/>
      <stop offset="1" stop-color="#0b5aa6"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#003366" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>

  <circle cx="1220" cy="270" r="260" fill="#003366" opacity="0.08"/>
  <circle cx="1180" cy="310" r="170" fill="#993300" opacity="0.08"/>
  <circle cx="260" cy="820" r="220" fill="#003366" opacity="0.06"/>

  <g filter="url(#softShadow)">
